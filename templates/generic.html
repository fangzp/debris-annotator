<!DOCTYPE HTML>

<html>
	<head>
		<title>Debris Annotator</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--[if lte IE 8]><script src="static/js/ie/html5shiv.js"></script><![endif]-->
		<link rel="stylesheet" href="static/css/main.css" />
		<link rel="stylesheet" href="static/css/jqtree.css">
		<!--[if lte IE 9]><link rel="stylesheet" href="static/css/ie9.css" /><![endif]-->
		<!--[if lte IE 8]><link rel="stylesheet" href="static/css/ie8.css" /><![endif]-->
		<style>
			/* ---- Metadata form ---- */
			#metadata-form {
				background: #f7f7f7;
				border: 1px solid #ccc;
				border-radius: 6px;
				padding: 10px 14px;
				margin-bottom: 8px;
				font-family: Monaco, monospace;
				font-size: 13px;
				display: flex;
				flex-wrap: wrap;
				gap: 8px 18px;
				align-items: flex-end;
			}
			#metadata-form label { display: block; font-weight: bold; margin-bottom: 2px; }
			#metadata-form .field { display: flex; flex-direction: column; }
			#metadata-form input[type=text],
			#metadata-form select,
			#metadata-form textarea {
				font-family: Monaco, monospace; font-size: 12px;
				padding: 3px 6px; border: 1px solid #aaa; border-radius: 3px;
			}
			#metadata-form textarea { resize: vertical; height: 36px; width: 180px; }


			/* ---- Debris toolbar ---- */
			#debris-toolbar {
				background: #222;
				border-radius: 6px;
				padding: 8px 12px;
				margin-bottom: 8px;
				display: flex;
				align-items: center;
				gap: 12px;
				flex-wrap: wrap;
				font-family: Monaco, monospace;
			}
			#debris-toolbar label { color: #ccc; font-size: 12px; margin: 0; }

			/* Class dropdowns */
			.class-combo-select {
				font-size: 13px; font-family: Monaco, monospace;
				padding: 4px 8px; border-radius: 4px;
				border: 2px solid #555; background: #333; color: #fff;
			}
			#class-type   { min-width: 110px; }
			#class-density { min-width: 70px; }
			/* Image navigation */
			#chip-nav {
				display: flex; gap: 6px; align-items: center; margin-left: 8px;
			}
			#chip-counter { color: #aaa; font-size: 12px; font-family: Monaco, monospace; min-width: 60px; text-align: center; }

			/* Tool buttons */
			.tool-btn {
				padding: 5px 12px; border-radius: 4px; border: 2px solid #555;
				background: #333; color: #ccc; font-size: 13px;
				font-family: Monaco, monospace; cursor: pointer;
				transition: background 0.15s;
			}
			.tool-btn:hover { background: #444; }
			.tool-btn.active { background: #005a9e; border-color: #4af; color: #fff; }

			/* Brush size */
			#brush-size { width: 50px; font-size: 12px; padding: 3px 5px; border-radius: 4px; }

			/* Process button */
			#process-btn {
				padding: 5px 16px; border-radius: 4px; border: 2px solid #2a2;
				background: #1a3; color: #fff; font-size: 13px;
				font-family: Monaco, monospace; cursor: pointer; font-weight: bold;
			}
			#process-btn:hover { background: #2a4; }
			#process-btn:disabled { opacity: 0.5; cursor: default; }

			/* Mode selector */
			#mode-select {
				font-size: 12px; font-family: Monaco, monospace;
				padding: 3px 6px; border-radius: 4px;
				border: 1px solid #555; background: #333; color: #ccc;
			}

			/* Save status */
			#save-status {
				font-family: Monaco, monospace; font-size: 13px;
				padding: 4px 10px; border-radius: 4px; display: none; margin-top: 4px;
			}
			#save-status.success { background: #d4edda; color: #155724; }
			#save-status.error   { background: #f8d7da; color: #721c24; }

			/* Hide all original panels — replaced by the debris toolbar */
			.optionswrapper,
			.toolwrapper,
			/* history panel: the only .panelwrapper that's not inside .optionswrapper */
			#content > .panelwrapper,
			/* file controller bar inside #editor */
			#fileControler { display: none !important; }
		</style>
	</head>
	<body>

		<div id="wrapper">

			<header id="header" style="padding: 1.5em 1em 0.5em 1em">
				<h1 style="font-size:1.4em">Debris Annotation Tool</h1>
				<p style="margin:0.3em; font-size:0.9em">Fill in the metadata, then load an image and start painting.</p>
			</header>

			<div id="main" style="overflow:scroll">
				<!-- Hidden inputs required by annotator.js color-picker init -->
				<input name="color2" type="hidden" id="color_value" value="99cc00">
				<button id="colorSelector" class="jscolor {valueElement: 'color_value'}" style="display:none; font-size:12px; width:60%;">Pick a color</button>

				<!-- Metadata form -->
				<div id="metadata-form">
					<div class="field">
						<label for="meta-chip-id">Chip ID</label>
						<input type="text" id="meta-chip-id" name="chip_id" placeholder="(load an image)" style="width:160px">
					</div>
					<div class="field">
						<label for="meta-labeler-id">Labeler ID <span style="color:red">*</span></label>
						<input type="text" id="meta-labeler-id" name="labeler_id" placeholder="your ID" style="width:100px" required>
					</div>
					<div class="field">
						<label for="meta-hazard-type">Hazard Type</label>
						<select id="meta-hazard-type" name="hazard_type">
							<option value="hurricane">hurricane</option>
							<option value="tornado">tornado</option>
							<option value="wildfire">wildfire</option>
							<option value="flood">flood</option>
							<option value="unknown">unknown</option>
						</select>
					</div>
					<div class="field">
						<label for="meta-pre-event-ref">Pre-event Ref</label>
						<select id="meta-pre-event-ref" name="pre_event_ref">
							<option value="none">none</option>
							<option value="google_basemap">google_basemap</option>
						</select>
					</div>
					<div class="field">
						<label for="meta-no-debris">No Debris</label>
						<select id="meta-no-debris" name="no_debris_type" title="Select if this chip contains no annotatable debris">
							<option value="">— debris present —</option>
							<option value="coastal/marine">coastal/marine</option>
							<option value="intact">intact</option>
							<option value="forest">forest</option>
							<option value="other">other (describe in Notes)</option>
						</select>
					</div>
					<div class="field">
						<label for="meta-notes">Notes (optional)</label>
						<textarea id="meta-notes" name="notes" placeholder="e.g. cloud cover, silt, staging area..."></textarea>
					</div>
					<div class="field">
						<label for="meta-save-dir">Save Directory</label>
						<input type="text" id="meta-save-dir" name="save_dir" placeholder="./outputs" style="width:200px" title="Server-side path where mask PNG and metadata JSON will be written">
					</div>
				</div>

				<!-- Debris annotation toolbar (replaces the Class + Object panels) -->
				<div id="debris-toolbar">
					<!-- Type + Density dropdowns — combined value drives the hidden #class-select -->
					<div style="display:flex; gap:6px; align-items:flex-end">
						<div>
							<label style="color:#ccc; font-size:12px; display:block">Type</label>
							<select id="class-type" class="class-combo-select">
								<option value="Vegetative">Vegetative</option>
								<option value="C/D">C/D</option>
								<option value="Other debris">Other debris</option>
								<option value="Damaged Building">Damaged Building</option>
								<option value="Uncertain">Uncertain</option>
							</select>
						</div>
						<div id="density-wrapper">
							<label style="color:#ccc; font-size:12px; display:block">Density</label>
							<select id="class-density" class="class-combo-select">
								<option value="Low">Low</option>
								<option value="High">High</option>
							</select>
						</div>
						<!-- Hidden master select, populated from backend, driven by type+density -->
						<select id="class-select" style="display:none"></select>
					</div>

					<div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap">
						<label style="color:#ccc; font-size:12px">Tool</label>
						<button class="tool-btn" id="btn-rect" data-tool="Rectangle" title="Draw bounding box around suspected debris first, then paint strokes inside it">&#9633; Box</button>
						<button class="tool-btn" id="btn-pospen" data-tool="posPen" title="Paint foreground (what to label)">+ Pen</button>
						<button class="tool-btn" id="btn-negpen" data-tool="negPen" title="Paint background (what NOT to label)">− Pen</button>
						<button class="tool-btn" id="btn-erase-pos" data-tool="erasePos" title="Erase + (foreground) strokes">Erase+</button>
						<button class="tool-btn" id="btn-erase-neg" data-tool="eraseNeg" title="Erase − (background) strokes">Erase−</button>
						<button class="tool-btn" id="btn-toggle-pos" title="Toggle + stroke visibility" style="opacity:1">&#128065;+</button>
						<button class="tool-btn" id="btn-toggle-neg" title="Toggle − stroke visibility" style="opacity:1">&#128065;−</button>
					</div>

					<div style="display:flex; gap:4px; align-items:center">
						<label for="brush-size" style="color:#ccc; font-size:12px">Size</label>
						<select id="brush-size" class="tool-btn" style="padding:3px 5px; min-width:55px">
							<option>1</option><option>2</option><option>3</option>
							<option>4</option><option>5</option><option>6</option>
							<option>7</option><option selected>8</option><option>9</option><option>10</option>
						</select>
					</div>

					<div style="display:flex; gap:4px; align-items:center">
						<label for="mode-select" style="color:#ccc; font-size:12px">Mode</label>
						<select id="mode-select">
							<option value="GrabCut">GrabCut</option>
							<option value="Manual">Manual</option>
						</select>
					</div>

					<button id="process-btn" title="Process strokes into mask (Space)">&#9654; Process</button>

					<div style="display:flex; gap:6px; align-items:center; margin-left:auto">
						<button class="tool-btn" id="btn-undo" title="Undo (W)">Undo</button>
						<button class="tool-btn" id="btn-redo" title="Redo (S)">Redo</button>
						<button class="tool-btn" id="btn-clear-pos" title="Clear + strokes">Clear+</button>
						<button class="tool-btn" id="btn-clear-neg" title="Clear − strokes">Clear−</button>
					</div>

					<button class="tool-btn" id="btn-save"
					        style="border-color:#a63; color:#fa8; padding:5px 14px"
					        title="Save annotation PNG + metadata JSON">
						&#128190; Save
					</button>

					<!-- Image navigation (only visible when multiple images are loaded) -->
					<div id="chip-nav" style="display:none">
						<button class="tool-btn" id="btn-prev-chip" title="Previous image">&#9664;</button>
						<span id="chip-counter">1 / 1</span>
						<button class="tool-btn" id="btn-next-chip" title="Next image">&#9654;</button>
					</div>
				</div>
				<div id="save-status"></div>

				<!-- Canvas area -->
				<section id="content" class="main">
					<p style="font-family:Monaco; font-size:12px; color:#888">
						Drag or click to load a chip PNG. Paint strokes, then press <b>Process</b> (or Space) to compute the mask.
					</p>
					<div id="canvas-wrapper"></div>
				</section>
			</div>

			<footer id="footer" style="padding:1em 1em 0.5em 1em">
				<p class="copyright" style="margin:0.2em">&copy; Deep Machine Vision Group. Design: <a href="https://html5up.net">HTML5 UP</a>.</p>
			</footer>
		</div>

		<!-- Scripts -->
		<script src="static/js/jquery.min.js"></script>
		<script src="https://code.jquery.com/jquery-migrate-1.4.1.min.js"></script>
		<script src="static/js/jquery.scrollex.min.js"></script>
		<script src="static/js/jquery.scrolly.min.js"></script>
		<script src="static/js/skel.min.js"></script>
		<script src="static/js/util.js"></script>
		<script src="static/js/jscolor.min.js"></script>
		<script src="static/js/tree.jquery.js"></script>
		<!--[if lte IE 8]><script src="static/js/ie/respond.min.js"></script><![endif]-->
		<script src="static/js/annotator.js"></script>
		<script src="static/js/imgloader.js"></script>
		<script src="static/js/main.js"></script>
		<script src="static/js/FileSaver.min.js"></script>
		<script src="//cdnjs.cloudflare.com/ajax/libs/mousetrap/1.4.6/mousetrap.min.js"></script>
		<script src="//cdnjs.cloudflare.com/ajax/libs/mousetrap/1.4.6/mousetrap-bind-dictionary.min.js"></script>

		<script>
		$(function() {

			// ---- Persist labeler_id and save_dir ----
			var storedId = localStorage.getItem('debris_labeler_id');
			if (storedId) $('#meta-labeler-id').val(storedId);
			$('#meta-labeler-id').on('change', function() {
				localStorage.setItem('debris_labeler_id', $(this).val());
			});
			var storedDir = localStorage.getItem('debris_save_dir');
			if (storedDir) $('#meta-save-dir').val(storedDir);
			$('#meta-save-dir').on('change', function() {
				localStorage.setItem('debris_save_dir', $(this).val());
			});

			// ---- Auto-update chip_id when annotator loads an image ----
			var chipObserver = new MutationObserver(function() {
				var data = $('#canvas-wrapper').data('annotator');
				if (data && data.images && data.images.length > 0) {
					var fname = data.images[data.curImgID] ? data.images[data.curImgID].name : '';
					if (fname && fname !== $('#meta-chip-id').val())
						$('#meta-chip-id').val(fname);
				}
			});
			chipObserver.observe(document.getElementById('canvas-wrapper'), {childList: true, subtree: true});

			// Shared reference to the annotator instance, set when an image is loaded.
			var annoRef = null;
			// Map class name → hieUid of its class-subnode in the hierarchy tree.
			var classSubnodeId = {};

			// ---- Tool buttons — pen/box/erase tools ----
			// erasePos/eraseNeg are handled entirely in annotator.js (no .toolkit-item span);
			// just set annoRef.curTool directly for those.
			$('.tool-btn[data-tool]').on('click', function() {
				var tool = $(this).data('tool');
				if (tool === 'erasePos' || tool === 'eraseNeg') {
					if (annoRef) annoRef.curTool = tool;
				} else {
					$(".toolkit-item:contains('" + tool + "')").click();
				}
				$('.tool-btn[data-tool]').removeClass('active');
				$(this).addClass('active');
			});

			// ---- Visibility toggles for + / − strokes ----
			$('#btn-toggle-pos').on('click', function() {
				if (!annoRef) return;
				annoRef.showPosStrokes = !annoRef.showPosStrokes;
				$(this).css('opacity', annoRef.showPosStrokes ? '1' : '0.35');
				annoRef.clearRectFromCanvas();
				if (annoRef.bbox && annoRef.bbox.isBox) annoRef.drawRect(annoRef.ctxP);
			});
			$('#btn-toggle-neg').on('click', function() {
				if (!annoRef) return;
				annoRef.showNegStrokes = !annoRef.showNegStrokes;
				$(this).css('opacity', annoRef.showNegStrokes ? '1' : '0.35');
				annoRef.clearRectFromCanvas();
				if (annoRef.bbox && annoRef.bbox.isBox) annoRef.drawRect(annoRef.ctxP);
			});

			// ---- Brush size — trigger the hidden #selWidth select ----
			$('#brush-size').on('change', function() {
				$('#selWidth').val($(this).val()).trigger('change');
			});

			// ---- Mode — trigger the hidden #selMode select ----
			$('#mode-select').on('change', function() {
				$('#selMode').val($(this).val()).trigger('change');
			});

			// ---- Process button ----
			$('#process-btn').on('click', function() {
				$('#perform').click();
			});

			// ---- Undo / Redo / Clear ----
			$('#btn-undo').on('click',      function() { $('#undoHis').click(); });
			$('#btn-redo').on('click',      function() { $('#redoHis').click(); });
			$('#btn-clear-pos').on('click', function() { $('#clearPos').click(); });
			$('#btn-clear-neg').on('click', function() { $('#clearNeg').click(); });

			// ---- Save button ----
			$('#btn-save').on('click', function() {
				if (!annoRef) { showSaveStatus('Load an image first.', false); return; }
				var chipId   = $('#meta-chip-id').val() || 'unknown';
				var saveDir  = $('#meta-save-dir').val().trim() || './outputs';
				var pngData  = annoRef.renderMask(annoRef.labelWorking, 'class index');
				// POST mask PNG to server at the chosen save directory
				$.ajax({
					url: '/save_mask', method: 'POST',
					contentType: 'application/json',
					data: JSON.stringify({chip_id: chipId, png_data: pngData, save_dir: saveDir}),
					success: function(r) {
						showSaveStatus('Mask saved → ' + r.path, true);
					},
					error: function() { showSaveStatus('Mask save failed — check server.', false); }
				});
				saveMetadata();
			});

			// Types that carry no Low/High density qualifier (must match config.py NO_DENSITY_TYPES).
			var NO_DENSITY_TYPES = ['Damaged Building', 'Uncertain'];

			// ---- Type + Density dropdowns → drive the hidden #class-select ----
			function syncClassSelect() {
				var type = $('#class-type').val();
				var noDens = NO_DENSITY_TYPES.indexOf(type) !== -1;
				$('#density-wrapper').toggle(!noDens);
				var name = noDens ? type : (type + ' - ' + $('#class-density').val());
				$('#class-select').val(name).trigger('change');
			}
			$('#class-type, #class-density').on('change', syncClassSelect);

			// ---- Class dropdown — delegates to annotator when available ----
			$('#class-select').on('change', function() {
				var name = $(this).val();
				if (annoRef && classSubnodeId[name] !== undefined) {
					annoRef.updateHieHighlight(classSubnodeId[name]);
					annoRef.classChange = true;
					annoRef.posPoints = [];
					annoRef.negPoints = [];
					if (annoRef.ctxP) {
						annoRef.ctxP.clearRect(0, 0, annoRef.width, annoRef.height);
						annoRef.drawRect && annoRef.drawRect(annoRef.ctxP);
					}
				}
			});

			// ---- Fetch fixed classes and populate hidden #class-select ----
			$.get('/get_classes', function(classes) {
				classes.forEach(function(cls) {
					$('#class-select').append(
						$('<option>').val(cls.name).text(cls.name).attr('data-color', cls.color)
					);
				});

				// Once an image is loaded the annotator is created — set up the hierarchy then.
				waitForAnnotator(function(anno) {
					annoRef = anno;
					anno.classOrder = classes.map(function(c) { return c.name; });
					setupAutoHierarchy(anno, classes);
					// Sync toolbar state into the annotator's hidden controls
					$('#selMode').val($('#mode-select').val()).trigger('change');
					$('#selWidth').val($('#brush-size').val()).trigger('change');
					// Activate the default tool (posPen)
					$(".toolkit-item:contains('posPen')").click();
					// Drive #class-select from the visible type+density dropdowns
					syncClassSelect();
					// Show navigation if more than one image was loaded
					updateChipNav();
				});
			});

			// Poll until annotator instance exists (created on first image load).
			function waitForAnnotator(cb) {
				var t = setInterval(function() {
					var data = $('#canvas-wrapper').data('annotator');
					if (data && data.$selectClassFrame) {
						clearInterval(t);
						cb(data);
					}
				}, 200);
			}

			// For each fixed class, create one object+class pair in the hierarchy.
			// One accumulated mask per class; instances recovered via connected
			// components in demo_parse.py at export time.
			function setupAutoHierarchy(anno, classes) {
				classes.forEach(function(cls) {
					var color = cls.color.replace('#', '');
					anno.addAnnoClass(cls.name, color, null, anno.$selectClassFrame, anno.$errorMsg);
					anno.addAnnoClassToHiePanel(cls.name, color);
				});

				classes.forEach(function(cls) {
					var color = cls.color.replace('#', '');
					var item = {name: cls.name, classes: []};
					anno.addHierarchy(item, anno.$selectHieFrame, anno.$errorHieMsg, anno.$hieOptions);
					var objId = anno.hieUid;
					anno.addOneSubNode(objId, anno.$selectHieFrame, {name: cls.name, color: color});
					classSubnodeId[cls.name] = anno.hieUid;
				});

				anno.renderHierarchyFrame();

				// Pre-select first class
				anno.updateHieHighlight(classSubnodeId[classes[0].name]);
				anno.classChange = true;
			}

			// ---- Metadata save ----
			function saveMetadata() {
				var chipId = $('#meta-chip-id').val();
				var labelerId = $('#meta-labeler-id').val();
				if (!labelerId) {
					showSaveStatus('Enter your Labeler ID before saving.', false);
					return;
				}
				var payload = {
					chip_id:        chipId || 'unknown',
					labeler_id:     labelerId,
					hazard_type:    $('#meta-hazard-type').val(),
					pre_event_ref:  $('#meta-pre-event-ref').val(),
					no_debris_type: $('#meta-no-debris').val() || null,
					notes:          $('#meta-notes').val(),
					save_dir:       $('#meta-save-dir').val().trim() || './outputs'
				};
				$.ajax({
					url: '/save_metadata', method: 'POST',
					contentType: 'application/json', data: JSON.stringify(payload),
					success: function(resp) {
						showSaveStatus(resp.success
							? 'Saved annotation + metadata for ' + (chipId || 'unknown')
							: 'Metadata save failed.', resp.success);
					},
					error: function() { showSaveStatus('Metadata save error — check server.', false); }
				});
			}

			function showSaveStatus(msg, ok) {
				$('#save-status').text(msg)
					.removeClass('success error').addClass(ok ? 'success' : 'error')
					.show();
				setTimeout(function() { $('#save-status').fadeOut(); }, 4000);
			}

			// ---- Image navigation (prev / next chip) ----
			// The annotator populates a hidden gallery; we click its items programmatically.
			function updateChipNav() {
				var items = $('.image-item');
				if (items.length > 1) {
					$('#chip-nav').show();
				}
				var curId = annoRef ? annoRef.curImgID : 0;
				$('#chip-counter').text((curId + 1) + ' / ' + items.length);
			}

			$('#btn-prev-chip').on('click', function() {
				if (!annoRef) return;
				var items = $('.image-item');
				var idx = Math.max(0, annoRef.curImgID - 1);
				$(items[idx]).click();
				setTimeout(updateChipNav, 300);
			});

			$('#btn-next-chip').on('click', function() {
				if (!annoRef) return;
				var items = $('.image-item');
				var idx = Math.min(items.length - 1, annoRef.curImgID + 1);
				$(items[idx]).click();
				setTimeout(updateChipNav, 300);
			});

		});
		</script>
	</body>
</html>
